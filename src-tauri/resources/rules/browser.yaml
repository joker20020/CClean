- id: browser.safari
  name: Safari 缓存
  category: browser
  risk: L1
  os: [macos]
  default_selected: false
  delete: permanent
  description: 仅清理 Caches 目录，不碰书签、历史与密码
  targets:
    - os: [macos]
      paths:
        - "${HOME}/Library/Caches/com.apple.Safari"
