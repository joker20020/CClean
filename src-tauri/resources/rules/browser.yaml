# 浏览器缓存：只清 Cache 族目录，绝不触碰 Cookies/历史/书签/密码
- id: browser.chrome
  name: Chrome 缓存
  category: browser
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 仅清理 Cache / Code Cache / GPUCache；浏览器运行时部分文件会跳过，建议先关闭
  targets:
    - os: [windows]
      paths:
        - "${LOCALAPPDATA}/Google/Chrome/User Data/*/Cache"
        - "${LOCALAPPDATA}/Google/Chrome/User Data/*/Code Cache"
        - "${LOCALAPPDATA}/Google/Chrome/User Data/*/GPUCache"
    - os: [macos]
      paths:
        - "${HOME}/Library/Application Support/Google/Chrome/*/Cache"
        - "${HOME}/Library/Application Support/Google/Chrome/*/Code Cache"
        - "${HOME}/Library/Application Support/Google/Chrome/*/GPUCache"

