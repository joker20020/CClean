# AI 工具专项：AI IDE 与 AI 桌面端缓存（可清理）；模型库见 report.yaml（只报告）
- id: ai.cursor
  name: Cursor 缓存
  category: ai
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 只清 Electron 缓存族目录与日志，不碰工作区状态、登录与设置
  targets:
    - os: [windows]
      paths:
        - "${APPDATA}/Cursor/Cache"
        - "${APPDATA}/Cursor/CachedData"
        - "${APPDATA}/Cursor/Code Cache"
        - "${APPDATA}/Cursor/GPUCache"
        - "${APPDATA}/Cursor/logs"
        - "${APPDATA}/Cursor/CachedExtensionVSIXs"
    - os: [macos]
      paths:
        - "${HOME}/Library/Application Support/Cursor/Cache"
        - "${HOME}/Library/Application Support/Cursor/CachedData"
        - "${HOME}/Library/Application Support/Cursor/Code Cache"
        - "${HOME}/Library/Application Support/Cursor/GPUCache"
        - "${HOME}/Library/Application Support/Cursor/logs"
        - "${HOME}/Library/Application Support/Cursor/CachedExtensionVSIXs"

