  delete: permanent
  description: ~/.zcode/cli/exec 保存历史任务的终端命令输出，从不自动清理、会持续增长；官方 FAQ 确认可删，代价是无法回看历史任务的终端输出，配置与会话不受影响
  targets:
    - os: [windows, macos]
      paths:
        - "${HOME}/.zcode/cli/exec"

