- id: ai.hf_incomplete
  name: HuggingFace 未完成下载
  category: ai
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 仅清理 hub 目录下的 .incomplete 下载残片；完整模型在“AI 专项”页只报告、不删除
  targets:
    - os: [windows, macos]
      paths: ["${HOME}/.cache/huggingface/hub"]
      include: ["**/*.incomplete"]

- id: ai.torch_extensions
  name: Torch 扩展编译缓存
  category: ai
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 自定义 CUDA/算子的 JIT 编译产物，下次运行自动重新编译
  targets:
    - os: [windows]
      paths: ["${LOCALAPPDATA}/torch_extensions"]
    - os: [macos]
      paths: ["${HOME}/.cache/torch_extensions"]

- id: ai.jupyter_runtime
  name: Jupyter 运行时文件
  category: ai
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 历史 kernel 连接文件（kernel-*.json）与运行时残留
  targets:
    - os: [windows]
      paths: ["${APPDATA}/jupyter/runtime"]
    - os: [macos]
      paths: ["${HOME}/Library/Jupyter/runtime"]

# ===== 常用 Agent 工具（桌面端 / CLI）=====

- id: ai.doubao
  name: 豆包桌面端缓存
  category: ai
  risk: L1
  os: [windows, macos]
  default_selected: true
  delete: permanent
  description: 豆包桌面客户端的 Chromium 缓存、着色器缓存与组件缓存；不碰登录、对话记录与 skills
  targets:
    - os: [windows]
      paths:
        - "${LOCALAPPDATA}/Doubao/User Data/Default/Cache"
        - "${LOCALAPPDATA}/Doubao/User Data/Default/Code Cache"
        - "${LOCALAPPDATA}/Doubao/User Data/Default/GPUCache"
        - "${LOCALAPPDATA}/Doubao/User Data/Default/DawnGraphiteCache"
        - "${LOCALAPPDATA}/Doubao/User Data/Default/DawnWebGPUCache"
        - "${LOCALAPPDATA}/Doubao/User Data/Default/AutofillAiModelCache"
        - "${LOCALAPPDATA}/Doubao/User Data/ShaderCache"
        - "${LOCALAPPDATA}/Doubao/User Data/GrShaderCache"
        - "${LOCALAPPDATA}/Doubao/User Data/GraphiteDawnCache"
        - "${LOCALAPPDATA}/Doubao/User Data/gecko_cache"
        - "${LOCALAPPDATA}/Doubao/User Data/component_crx_cache"
        - "${LOCALAPPDATA}/Doubao/User Data/extensions_crx_cache"
        - "${LOCALAPPDATA}/Doubao/User Data/Crashpad"
    - os: [macos]
      paths:
        - "${HOME}/Library/Application Support/Doubao/User Data/Default/Cache"
        - "${HOME}/Library/Application Support/Doubao/User Data/Default/Code Cache"
        - "${HOME}/Library/Application Support/Doubao/User Data/Default/GPUCache"
        - "${HOME}/Library/Application Support/Doubao/User Data/ShaderCache"
        - "${HOME}/Library/Caches/Doubao"

