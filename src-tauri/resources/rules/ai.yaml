        - "${APPDATA}/Code/GPUCache"
        - "${APPDATA}/Code/logs"
        - "${APPDATA}/VSCodium/Cache"
        - "${APPDATA}/VSCodium/CachedData"
        - "${APPDATA}/VSCodium/GPUCache"
        - "${APPDATA}/Windsurf/Cache"
        - "${APPDATA}/Windsurf/CachedData"
        - "${APPDATA}/Windsurf/GPUCache"
        - "${APPDATA}/Trae/Cache"
        - "${APPDATA}/Trae/CachedData"
        - "${APPDATA}/Trae/GPUCache"
    - os: [macos]
      paths:
        - "${HOME}/Library/Application Support/Code/Cache"
        - "${HOME}/Library/Application Support/Code/CachedData"
        - "${HOME}/Library/Application Support/Code/GPUCache"
        - "${HOME}/Library/Application Support/Code/logs"
        - "${HOME}/Library/Application Support/VSCodium/Cache"
        - "${HOME}/Library/Application Support/VSCodium/CachedData"
        - "${HOME}/Library/Application Support/Windsurf/Cache"
        - "${HOME}/Library/Application Support/Windsurf/CachedData"
        - "${HOME}/Library/Application Support/Trae/Cache"
        - "${HOME}/Library/Application Support/Trae/CachedData"

